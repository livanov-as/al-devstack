version: '3.8'

services:
  # 1. Local Database Layer (MongoDB)
  mongodb:
    image: mongo:latest
    container_name: al-mongodb
    ports:
      - "27017:27017"
    volumes:
      # Mount dump matrices and shell automation sequence to custom init entrypoint
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend API Domain Layer (Express Node Server)
  backend:
    build: ./backend
    container_name: al-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/al-devstack
      - CACHE_SECRET_TOKEN=local_dev_secret_token_2026
    depends_on:
      mongodb:
        condition: service_healthy

  # 3. Frontend Web Interface Layer (React + Vite + Nginx Reverse Proxy)
  frontend:
    build: ./frontend
    container_name: al-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # 4. Scraper Pipeline Engine Layer (Python + Playwright Lifecycle Execution)
  parser:
    build: ./parser
    container_name: al-parser
    environment:
      - MONGO_URI=mongodb://mongodb:27017/al-devstack
      - CACHE_SECRET_TOKEN=local_dev_secret_token_2026
      - PARSER_MODE=INCREMENTAL
      - BACKEND_INTERNAL_URL=http://backend:5000/api
    depends_on:
      mongodb:
        condition: service_healthy
      backend:
        condition: service_started
