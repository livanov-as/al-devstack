name: FreeCodeCamp Profile Parser Lifecycle

on:
  schedule:
    # Weekly Execution: Every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      parser_mode:
        description: 'Select operational database scanning profile mode'
        required: true
        default: 'INCREMENTAL'
        type: choice
        options:
          - INCREMENTAL
          - TOTAL
  repository_dispatch:
    types: [trigger-user-sync]

jobs:
  run-parser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          cd parser
          pip install -r requirements.txt
          playwright install chromium

      # STEP A: Initialize default runtime execution profile mode
      - name: Set Default Parser Mode
        run: echo "RUN_MODE=INCREMENTAL" >> $GITHUB_ENV

      # STEP B: Handle manual workflow dispatch input choice override sequence
      - name: Handle Manual Override
        if: github.event_name == 'workflow_dispatch'
        run: echo "RUN_MODE=${{ github.event.inputs.parser_mode }}" >> $GITHUB_ENV

      # STEP C: Resolve target username from API repository dispatch payload if available
      - name: Resolve Target Telemetry User
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "TARGET_USER=${{ github.event.client_payload.username }}" >> $GITHUB_ENV
            echo "RUN_MODE=TOTAL" >> $GITHUB_ENV
          else
            echo "TARGET_USER=" >> $GITHUB_ENV
          fi

      # STEP D: Launch core scraper process utilizing dynamic Atlas queue orchestration
      - name: Execute Scraper Pipeline
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          CACHE_SECRET_TOKEN: ${{ secrets.CACHE_SECRET_TOKEN }}
          PARSER_MODE: ${{ env.RUN_MODE }}
          # Active infrastructure deployment route mapping targets
          BACKEND_INTERNAL_URL: 'https://al-devstack-production.up.railway.app'
        run: |
          cd parser
          if [ -n "$TARGET_USER" ]; then
            echo " 📡 Remote execution trigger caught for user: $TARGET_USER"
            python -u main.py "$TARGET_USER"
          else
            echo " ⏳ Standard cycle execution active for entire telemetry database queue"
            python -u main.py
          fi
